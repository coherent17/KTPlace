site_name: KTPlace documentation
site_description: The placement algorithms behind KTPlace, explained from the ground up
site_url: https://coherent17.github.io/KTPlace/
repo_url: https://github.com/coherent17/KTPlace
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

exclude_docs: |
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  icon:
    logo: material/chip
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - markdown_callouts.github_callouts
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

nav:
  - Home: README.md
  - Foundations:
      - Overview: foundations/README.md
      - 1. The placement problem: foundations/01-placement-problem.md
      - 2. The math toolkit: foundations/02-math-toolkit.md
      - 3. Quadratic placement: foundations/03-quadratic-placement.md
      - 4. Solving linear systems: foundations/04-solving-linear-systems.md
      - 5. Net models: foundations/05-net-models.md
  - Global placement:
      - SimPL:
          - Overview: global-placement/simpl/README.md
          - 1. The SimPL idea: global-placement/simpl/01-the-simpl-idea.md
          - 2. Look-ahead legalization: global-placement/simpl/02-look-ahead-legalization.md
          - 3. Anchors and convergence: global-placement/simpl/03-anchors-and-convergence.md
          - 4. Speed, results, parallelism: global-placement/simpl/04-speed-results-parallelism.md
  - Glossary: glossary.md
  - References: references.md
