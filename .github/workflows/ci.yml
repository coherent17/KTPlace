name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux / Format check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libboost-test-dev \
            clang-format

      - name: Show toolchain
        run: |
          g++ --version | head -1
          clang-format --version
          dpkg -l | grep -E 'libboost-test' | awk '{print $2, $3}'
          git submodule status

      - name: Check formatting
        run: |
          # Every tracked source under src/ must already match .clang-format;
          # third-party code lives in submodules under third_party/.
          status=0
          for f in $(git ls-files 'src/*.cc' 'src/*.h'); do
            if ! clang-format --dry-run --Werror "$f" > /dev/null 2>&1; then
              echo "::error file=$f::not clang-format clean; run clang-format -i $f"
              status=1
            fi
          done
          exit $status

      - name: Build
        # -j with the runner's own core count. The default is a serial build,
        # which on a 4-core runner is several minutes of one compiler; the unit
        # test binaries link the same objects, so they get the same treatment.
        run: make -j"$(nproc)"

      - name: Build the unit tests
        run: make -C src -f Master.make -j"$(nproc)" test-build

      - name: Without GUI=1, ktplace --gui says how to get the window
        run: |
          if build/bin/ktplace --gui 2> gui.err; then exit 1; fi
          grep -q "make GUI=1" gui.err

      - name: Pack the binaries
        # Debug info is most of the 450 MB; the jobs below only run the binaries.
        run: |
          strip --strip-debug build/bin/*
          tar -czf binaries.tar.gz build/bin ktplace.sh ktplace.csh

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: binaries.tar.gz
          retention-days: 1

  unit-tests:
    name: Linux / Unit tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-test-dev

      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Unpack the binaries
        run: tar -xzf binaries.tar.gz

      - name: Unit tests
        run: |
          fail=0
          for t in build/bin/test_*; do
            echo "--- $(basename "$t") ---"
            "$t" --log_level=test_suite || fail=1
          done
          exit $fail

  placement:
    name: Linux / Placement and determinism (adaptec1, ibm01)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Unpack the binaries
        run: tar -xzf binaries.tar.gz

      - name: Place each design twice
        # Run "a" is the smoke placement the checks below read; run "b" exists only
        # to be compared with it. ktplace is invoked through the documented wrapper.
        run: |
          set -euo pipefail
          source ktplace.sh

          cat > adaptec1.tcl <<'TCL'
          add_option visualizer anim 1
          add_option visualizer anim_max_frames 40
          add_option visualizer anim_blend 1
          TCL
          cat > ibm01.tcl <<'TCL'
          add_option visualizer anim_zoom 1
          add_option visualizer final_zoom 1
          TCL

          for run in a b; do
            ktplace ./benchmark/bookshelf/ISPD_2005/adaptec1 -w "out/adaptec1-$run" \
              -tcl adaptec1.tcl > "adaptec1-$run.log" 2>&1
            ktplace ./benchmark/bookshelf/ICCAD04/ibm01 -w "out/ibm01-$run" \
              -tcl ibm01.tcl > "ibm01-$run.log" 2>&1
          done

      - name: adaptec1 smoke checks
        run: |
          set -euo pipefail
          log=adaptec1-a.log
          grep -q "Loaded: 211447 cells (543 terminals), 221142 nets, 944053 pins, 890 rows" "$log"
          test "$(grep -c 'Placement completed successfully' "$log")" -eq 1
          test "$(wc -l < out/adaptec1-a/placed.pl)" -eq 211447
          # Spreading must reduce the overflow; loose because the parallel CG moves
          # the last digits between machines.
          final=$(awk -F'|' '/scaled overflow \(final\)/ {gsub(/ /, "", $4); print $4}' "$log")
          echo "final scaled overflow: $final"
          test -n "$final"
          awk -v v="$final" 'BEGIN { exit !(v < 0.5) }'

      - name: ISPD 2005 contest evaluator
        run: |
          set -euo pipefail
          benchmark/bookshelf/ISPD_2005/evaluator/evaluate.sh \
            benchmark/bookshelf/ISPD_2005/adaptec1 out/adaptec1-a/placed.pl | tee evaluate.log
          official=$(sed -n 's/.*Total HPWL: *//p' evaluate.log)
          logged=$(awk -F'|' '/^\| detailed placement \(/ {gsub(/ /, "", $3); print $3}' adaptec1-a.log)
          echo "official HPWL $official, ktplace HPWL $logged"
          awk -v a="$official" -v b="$logged" 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(d <= 1e-6 * a) }'

      - name: ibm01 multi-row checks
        # ibm01 is the only design with cells taller than a row (246 of 12,506
        # movable), so it is the only one that reaches the multi-row legalizer.
        run: |
          set -euo pipefail
          log=ibm01-a.log
          grep -q "Loaded: 12752 cells (246 terminals), 14111 nets, 50566 pins, 144 rows" "$log"
          test "$(grep -c 'Placement completed successfully' "$log")" -eq 1
          test "$(wc -l < out/ibm01-a/placed.pl)" -eq 12752
          grep -q "multi-row legalization (246 cell(s) taller than a row)" "$log"
          test "$(awk -F'|' '/^\| cells placed/ {gsub(/ /,"",$3); print $3}' "$log")" -eq 12506
          test "$(awk -F'|' '/^\| cells unplaced/ {gsub(/ /,"",$3); print $3}' "$log")" -eq 0
          test "$(awk -F'|' '/^\| of those, placed/ {gsub(/ /,"",$3); print $3}' "$log")" -eq 246
          test "$(grep -c 'verdict *| *PASS' "$log")" -eq 2
          test "$(grep -c 'verdict *| *FAIL' "$log" || true)" -eq 0

      - name: Both runs wrote the same files
        run: |
          set -euo pipefail
          cmp out/adaptec1-a/placed.pl out/adaptec1-b/placed.pl
          cmp out/ibm01-a/placed.pl out/ibm01-b/placed.pl
          diff -r out/ibm01-a/plots out/ibm01-b/plots
          mkdir -p placements
          cp out/adaptec1-a/placed.pl placements/adaptec1.pl
          cp out/ibm01-a/placed.pl placements/ibm01.pl

      - uses: actions/upload-artifact@v4
        with:
          name: placements-linux
          path: placements
          retention-days: 1

      - name: Upload the smoke placement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-placement
          path: |
            out/adaptec1-a/placed.pl
            adaptec1-a.log
            evaluate.log
            out/adaptec1-a/plots/placement.png
            out/adaptec1-a/plots/placement.gif
            out/adaptec1-a/plots/simpl_convergence.png
          if-no-files-found: ignore

  macos:
    # One GUI=1 build serves the command-line flow, the unit tests and the GUI tests.
    name: macOS / Build, tests, GUI and placement (Apple clang)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Boost.Test and Qt
        run: brew install boost qt

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" GUI=1

      - name: Unit tests
        run: make -j"$(sysctl -n hw.ncpu)" test

      - name: GUI tests
        run: make gui-test

      - name: ktplace --gui places a design
        run: |
          QT_QPA_PLATFORM=offscreen build/bin/ktplace --gui \
            benchmark/bookshelf/ICCAD04/ibm01 -w out/gui > gui.log 2>&1 &
          window=$!
          for _ in $(seq 1 120); do
            grep -qs 'Placement completed successfully' out/gui/ktplace.log && break
            grep -qs 'fatal' out/gui/ktplace.log gui.log && break
            sleep 1
          done
          kill "$window"
          test "$(wc -l < out/gui/placed.pl)" -eq 12752

      - name: Place ibm01 and adaptec1
        run: |
          set -euo pipefail
          source ktplace.sh
          echo 'add_option visualizer plot 0' > noplot.tcl
          ktplace ./benchmark/bookshelf/ICCAD04/ibm01 -w out/ibm01 -tcl noplot.tcl 2>&1 | tee ibm01.log
          ktplace ./benchmark/bookshelf/ISPD_2005/adaptec1 -w out/adaptec1 -tcl noplot.tcl 2>&1 | tee adaptec1.log
          for d in ibm01 adaptec1; do
            test "$(grep -c 'verdict *| *PASS' $d.log)" -eq 2
          done
          mkdir -p placements
          cp out/ibm01/placed.pl placements/ibm01.pl
          cp out/adaptec1/placed.pl placements/adaptec1.pl

      - uses: actions/upload-artifact@v4
        with:
          name: placements-macos
          path: placements
          retention-days: 1

  cross-platform:
    name: Linux vs macOS / Identical placed.pl
    needs: [placement, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: placements-linux
          path: linux

      - uses: actions/download-artifact@v4
        with:
          name: placements-macos
          path: macos

      - name: Compare placed.pl
        run: |
          set -euo pipefail
          sha256sum linux/* macos/*
          for d in ibm01 adaptec1; do
            cmp "linux/$d.pl" "macos/$d.pl"
          done

  gui:
    # Its own job, so the other Linux jobs never need Qt. Headless on Qt's
    # offscreen platform.
    name: Linux / GUI build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libboost-test-dev \
            qt6-base-dev \
            pkg-config \
            fonts-dejavu-core

      - name: Build ktplace with the GUI
        run: make -j"$(nproc)" GUI=1

      - name: GUI tests
        run: make gui-test

      - name: ktplace --gui places a design
        # The window places the design given on the command line as soon as it
        # opens, so its placed.pl appearing is the window having run the flow.
        run: |
          QT_QPA_PLATFORM=offscreen build/bin/ktplace --gui \
            benchmark/bookshelf/ICCAD04/ibm01 -w out/gui > gui.log 2>&1 &
          window=$!
          for _ in $(seq 1 120); do
            grep -qs 'Placement completed successfully' out/gui/ktplace.log && break
            grep -qs 'fatal' out/gui/ktplace.log gui.log && break
            sleep 1
          done
          kill "$window"
          test "$(wc -l < out/gui/placed.pl)" -eq 12752
