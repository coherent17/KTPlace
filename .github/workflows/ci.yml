name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and smoke placement
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libtbb-dev \
            libboost-iostreams-dev \
            libboost-test-dev \
            zlib1g-dev \
            libfmt-dev \
            clang-format \
            gcov

      - name: Show toolchain
        run: |
          g++ --version | head -1
          clang-format --version
          dpkg -l | grep -E 'libtbb|libboost-test|libfmt' | awk '{print $2, $3}'

      - name: Check formatting
        run: |
          # Every tracked first-party source must already match .clang-format.
          # Vendored third-party code is exempt: CImg.h is a 3.4 MB upstream
          # single-header library, and reformatting it would bury the vendored
          # copy in a diff that makes it impossible to compare against upstream or
          # to update. Doxygen already excludes it for the same reason.
          status=0
          for f in $(git ls-files 'src/*.cc' 'src/*.h' | grep -v '^src/visualization/CImg.h$'); do
            if ! clang-format --dry-run --Werror "$f" > /dev/null 2>&1; then
              echo "::error file=$f::not clang-format clean; run clang-format -i $f"
              status=1
            fi
          done
          exit $status

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Line coverage
        # gcov ships with gcc, so this needs no extra package and cannot be the
        # step that silently does not run. The gate is set at the current total
        # so a regression fails the build; raise it as coverage improves.
        run: |
          python3 scripts/coverage_report.py \
            --clean --build --min ${{ vars.COVERAGE_MIN || '80' }} \
            | tee coverage.txt

      - name: Publish the coverage report
        # GitHub renders the table on the run page whether or not it is
        # uploaded; the artifact is for reading a full run's numbers later.
        if: always()
        run: cat coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
          if-no-files-found: ignore

      - name: Smoke placement
        # adaptec1: 211,447 cells / 221,142 nets in Bookshelf form, the design the
        # ISPD 2005 table in the README is written against, and the only benchmark
        # in the tree. It is vendored rather than fetched (see .gitignore): the
        # ISPD 2005 suite has no working download URL, so a smoke test that had to
        # fetch it would be a build that fails for reasons that have nothing to do
        # with the code. Unlike the LEF/DEF design this replaces it also runs the
        # whole downstream flow -- legalization, detailed placement and the
        # independent legality check -- so the smoke test now covers a legal
        # placement end to end rather than just the reader and the solver, and it
        # is the design the image assertions below are measured against.
        run: |
          set -euo pipefail
          KTPLACE_ANIM=1 KTPLACE_ANIM_MAX_FRAMES=40 KTPLACE_ANIM_BLEND=1 \
          KTPLACE_SIMPL_TRACE_EVERY=1 KTPLACE_SIMPL_CG_EVERY=8 \
            ./build/bin/ktplace adaptec1 \
              ./benchmark/ISPD_2005/adaptec1 ./out.pl -p plots \
              -w output/adaptec1 2>&1 | tee smoke.log

          # The netlist must match the benchmark exactly.
          grep -q "Loaded: 211447 cells (543 terminals), 221142 nets, 944053 pins, 890 rows" \
            smoke.log

          # The run must finish cleanly and write one record per cell.
          test "$(grep -c 'Placement completed successfully' smoke.log)" -eq 1
          test "$(wc -l < out.pl)" -eq 211447

          # The point of the flow: what is written has to be a legal placement.
          # The checker is independent of the two stages that produced it, so this
          # is the assertion here that catches a legalizer or detailed placement
          # regression rather than a reader or solver one.
          test "$(grep -cE 'verdict +\| +PASS' smoke.log)" -eq 1
          test "$(grep -cE 'overlapping cell pairs +\| +0' smoke.log)" -eq 1

          # Coarse quality gate: spreading must actually reduce the overflow.
          # The threshold is deliberately loose because the CG solve is
          # parallel, so the last digits move between machines.
          # The report names this row "scaled overflow (final)"; matching the
          # old wording silently made the gate read an empty string, and awk
          # treats that as zero, so the gate passed without ever measuring.
          final=$(awk -F'|' '/scaled overflow \(final\)/ {gsub(/ /, "", $4); print $4}' smoke.log)
          echo "final scaled overflow: $final"
          test -n "$final"
          awk -v v="$final" 'BEGIN { exit !(v < 0.5) }'

      - name: Smoke placement draws every cell
        # The frames are the run's own report of the placement, and a frame that
        # silently drops cells is the one rendering fault that cannot be spotted by
        # looking at it -- the picture still looks like a placement. So the stills
        # the run above already produced are measured rather than eyeballed.
        run: |
          set -euo pipefail

          # The animation must be assembled from real stills.
          test -s output/adaptec1/plots/anim/placement.gif

          # The stills are the encoder's scratch space and are removed once the
          # GIF is written, so a directory full of them means the cleanup did not
          # run -- which is the observable half of "the GIF was really built".
          test -z "$(find output/adaptec1/plots/anim -name 'frame_*.ppm' -print -quit)"

          # The final still is the one meant to be looked at, so it is a PNG and
          # not a PPM: nothing a person would open reads a PPM.
          test -s output/adaptec1/plots/final/final.png
          head -c 8 output/adaptec1/plots/final/final.png |
            od -An -tx1 | tr -d ' \n' | grep -qx '89504e470d0a1a0a'

          # Zoom 4 of a 768x768 frame is 3072x3072, big enough that a standard
          # cell is several pixels across instead of one.
          geom=$(python3 -c '
          import struct
          d = open("output/adaptec1/plots/final/final.png", "rb").read()
          w, h = struct.unpack(">II", d[16:24])
          print(f"{w}x{h}")')
          echo "final image: $geom"
          test "$geom" = "3072x3072"

          # Every cell has to be in that picture. The movable cells are drawn in
          # one flat colour, so the design's cell area converted to image pixels
          # is the number of pixels that must carry it, and a decimation bug shows
          # up as a shortfall. A little over one is fine: the antialiased rim
          # around each cell lands on the same colour.
          python3 - <<'PY'
          import gzip
          import struct

          PNG = "output/adaptec1/plots/final/final.png"
          PPM = "output/adaptec1/plots/final/final.ppm"

          d = open(PNG, "rb").read()
          w, h = struct.unpack(">II", d[16:24])
          # The renderer lays the die out in the frame less its margins and its
          # caption band, at zoom 4: margin 36*4, band 116*4, both inset 2px,
          # over a span padded by 1% on each side.
          avail_w, avail_h = w - 2 * 144 - 2, h - 464 - 144 - 2

          # Die box and cell sizes straight out of the written placement, so this
          # measures the same design the picture was drawn from.
          sizes = {}
          for line in gzip.open("benchmark/ISPD_2005/adaptec1/adaptec1.nodes.gz", "rt"):
              t = line.split()
              if len(t) in (3, 4) and not t[0].startswith("Num"):
                  try:
                      sizes[t[0]] = (float(t[1]), float(t[2]))
                  except ValueError:
                      pass
          die = [1e18, 1e18, -1e18, -1e18]
          area = 0.0
          movable = 0
          for line in open("out.pl"):
              t = line.split()
              if len(t) < 3 or t[0] not in sizes:
                  continue
              x, y = float(t[1]), float(t[2])
              cw, ch = sizes[t[0]]
              if "FIXED" in line:
                  die[0] = min(die[0], x)
                  die[1] = min(die[1], y)
                  die[2] = max(die[2], x + cw)
                  die[3] = max(die[3], y + ch)
              else:
                  area += cw * ch
                  movable += 1
          assert movable == 210904, f"expected 210904 movable cells, read {movable}"

          span = max(die[2] - die[0], die[3] - die[1], 1.0)
          scale = min(avail_w, avail_h) / (1.02 * span)
          expected = area * scale * scale

          # Count the movable-cell colour in the lossless still the PNG was made
          # from, so the check needs no image decoder.
          f = open(PPM, "rb")
          assert f.readline().strip() == b"P6"
          f.readline()
          f.readline()
          data = f.read()
          bg, src, alpha = (0x10, 0x14, 0x18), (0x4F, 0xC3, 0xF7), 0.92
          want = tuple(int(round(alpha * src[i] + (1 - alpha) * bg[i])) for i in range(3))
          got = sum(1 for i in range(0, len(data), 3) if tuple(data[i:i + 3]) == want)

          ratio = got / expected
          print(f"movable cells {movable}, expected {expected:.0f} px, "
                f"drawn {got} px, ratio {ratio:.3f}")
          # Below this the picture is missing cells; well above 1 would mean the
          # expected-area model is wrong rather than that the render is wrong.
          assert ratio > 0.98, f"only {ratio:.1%} of the cell area is in the image"
          assert ratio < 1.10, f"unexpected cell pixel count ({ratio:.1%})"
          PY

      - name: Upload the smoke placement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-placement
          path: |
            out.pl
            smoke.log
            output/adaptec1/plots/final/final.png
            output/adaptec1/plots/anim/placement.gif
          if-no-files-found: ignore
