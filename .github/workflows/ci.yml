name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libtbb-dev \
            libboost-iostreams-dev \
            libboost-test-dev \
            zlib1g-dev \
            libfmt-dev \
            tcl-dev \
            clang-format

      - name: Show toolchain
        run: |
          g++ --version | head -1
          clang-format --version
          dpkg -l | grep -E 'libtbb|libboost-test|libfmt|tcl8.6-dev' | awk '{print $2, $3}'

      - name: Check formatting
        run: |
          # Every tracked first-party source must already match .clang-format.
          # Vendored third-party code is exempt: CImg.h is a 3.4 MB upstream
          # single-header library, and reformatting it would bury the vendored
          # copy in a diff that makes it impossible to compare against upstream or
          # to update. The vendored header is also the one file the formatter
          # target skips.
          status=0
          for f in $(git ls-files 'src/*.cc' 'src/*.h' | grep -v '^src/visualization/CImg.h$'); do
            if ! clang-format --dry-run --Werror "$f" > /dev/null 2>&1; then
              echo "::error file=$f::not clang-format clean; run clang-format -i $f"
              status=1
            fi
          done
          exit $status

      - name: Build
        # -j with the runner's own core count. The default is a serial build,
        # which on a 4-core runner is several minutes of one compiler; the unit
        # test binaries link the same objects, so they get the same treatment.
        run: make -j"$(nproc)"

      - name: Build the unit tests
        run: make -C src -f Master.make -j"$(nproc)" test-build

      - name: Pack the binaries
        # Debug info is most of the 450 MB; the jobs below only run the binaries.
        run: |
          strip --strip-debug build/bin/*
          tar -czf binaries.tar.gz build/bin ktplace.sh ktplace.csh

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: binaries.tar.gz
          retention-days: 1

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtbb-dev \
            libboost-iostreams-dev \
            libboost-test-dev \
            zlib1g-dev \
            libfmt-dev \
            libtcl8.6

      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Unpack the binaries
        run: tar -xzf binaries.tar.gz

      - name: Unit tests
        run: |
          fail=0
          for t in build/bin/test_*; do
            echo "--- $(basename "$t") ---"
            "$t" --log_level=test_suite || fail=1
          done
          exit $fail

  smoke-adaptec1:
    name: Smoke placement (adaptec1)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtbb-dev \
            libboost-iostreams-dev \
            zlib1g-dev \
            libfmt-dev \
            libtcl8.6

      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Unpack the binaries
        run: tar -xzf binaries.tar.gz

      - name: Smoke placement
        # adaptec1: 211,447 cells / 221,142 nets in Bookshelf form, the design the
        # ISPD 2005 table in the README is written against, and the only benchmark
        # in the tree. It is vendored rather than fetched (see .gitignore): the
        # ISPD 2005 suite has no working download URL, so a smoke test that had to
        # fetch it would be a build that fails for reasons that have nothing to do
        # with the code. Unlike the LEF/DEF design this replaces it also runs the
        # whole downstream flow -- legalization, detailed placement and the
        # independent legality check -- so the smoke test now covers a legal
        # placement end to end rather than just the reader and the solver, and it
        # is the design the image assertions below are measured against.
        run: |
          set -euo pipefail

          # The binary is invoked by name, through the same wrapper a person uses,
          # so the smoke test exercises the documented entry point rather than a
          # path only CI knows about. Sourcing it is what puts build/bin on PATH;
          # it is written into the repository root by the build.
          source ktplace.sh

          cat > smoke.tcl <<'TCL'
          add_option visualizer anim 1
          add_option visualizer anim_max_frames 40
          add_option visualizer anim_blend 1
          TCL

          ktplace ./benchmark/ISPD_2005/adaptec1 \
            -w output/adaptec1 -tcl smoke.tcl 2>&1 | tee smoke.log

          # Everything a run writes goes under the work directory, so the .pl is
          # output/adaptec1/placed.pl and the plots are output/adaptec1/plots.
          PL=output/adaptec1/placed.pl

          # The netlist must match the benchmark exactly.
          grep -q "Loaded: 211447 cells (543 terminals), 221142 nets, 944053 pins, 890 rows" \
            smoke.log

          # The run must finish cleanly and write one record per cell. `pipefail`
          # above already turns a crash or a nonzero exit into a failed step, so
          # this is the flow's own confirmation that it reached the end.
          test "$(grep -c 'Placement completed successfully' smoke.log)" -eq 1
          test "$(wc -l < "$PL")" -eq 211447

          # Deliberately not asserted: the legality verdict. Whether the run
          # produces a legal placement is a solver question this test cannot
          # settle honestly -- the answer moves with the machine, and a gate that
          # fails for that reason trains everyone to ignore a red build. The unit
          # tests cover legality on small designs where the expected answer is
          # known; here the gate is that the whole flow runs to completion
          # without crashing.

          # Coarse quality gate: spreading must actually reduce the overflow.
          # The threshold is deliberately loose because the CG solve is
          # parallel, so the last digits move between machines.
          # The report names this row "scaled overflow (final)"; matching the
          # old wording silently made the gate read an empty string, and awk
          # treats that as zero, so the gate passed without ever measuring.
          final=$(awk -F'|' '/scaled overflow \(final\)/ {gsub(/ /, "", $4); print $4}' smoke.log)
          echo "final scaled overflow: $final"
          test -n "$final"
          awk -v v="$final" 'BEGIN { exit !(v < 0.5) }'

      - name: Upload the smoke placement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-placement
          path: |
            output/adaptec1/placed.pl
            smoke.log
            output/adaptec1/plots/final/final.png
            output/adaptec1/plots/final/final.svg
            output/adaptec1/plots/anim/placement.gif
          if-no-files-found: ignore

  smoke-multirow:
    name: Multi-row smoke placement (ibm01)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtbb-dev \
            libboost-iostreams-dev \
            zlib1g-dev \
            libfmt-dev \
            libtcl8.6

      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Unpack the binaries
        run: tar -xzf binaries.tar.gz

      - name: Multi-row legalization smoke placement
        # ibm01 is the only benchmark in the tree with cells taller than a row --
        # 246 of its 12,506 movable cells -- so it is the only design that reaches
        # MultiRowLegalizer. It is vendored (see .gitignore) because it is what
        # holds that path to its contract, and it is small enough to assert on:
        # adaptec1's verdict moves with the machine, so the step above declines to
        # gate on it, whereas ibm01 legalizes in well under a second and lands on
        # zero overlapping pairs every run. Unlike the adaptec1 step, the legality
        # verdict *is* asserted here, and so is that the tall cells were placed at
        # all -- a multi-row legalizer that quietly skipped them would leave the
        # design illegal but could still report zero overlaps among what it placed.
        run: |
          set -euo pipefail

          source ktplace.sh

          cat > smoke-multirow.tcl <<'TCL'
          add_option visualizer anim 0
          TCL

          ktplace ./benchmark/ICCAD04/ibm01 \
            -w output/ibm01 -tcl smoke-multirow.tcl 2>&1 | tee smoke-multirow.log

          PL=output/ibm01/placed.pl

          grep -q "Loaded: 12752 cells (246 terminals), 14111 nets, 50566 pins, 144 rows"             smoke-multirow.log
          test "$(grep -c 'Placement completed successfully' smoke-multirow.log)" -eq 1
          test "$(wc -l < "$PL")" -eq 12752

          # The multi-row legalizer must be the path taken, not Abacus.
          grep -q "Running multi-row legalization (246 cell(s) taller than a row)" \
            smoke-multirow.log

          # Every cell placed, and the 246 tall ones among them.
          test "$(awk -F'|' '/^\| cells placed/ {gsub(/ /,"",$3); print $3}' \
            smoke-multirow.log)" -eq 12506
          test "$(awk -F'|' '/^\| cells unplaced/ {gsub(/ /,"",$3); print $3}' \
            smoke-multirow.log)" -eq 0
          test "$(awk -F'|' '/^\| of those, placed/ {gsub(/ /,"",$3); print $3}' \
            smoke-multirow.log)" -eq 246

          # Both stage checks must pass: legalization on its own, and the
          # placement that actually gets written.
          test "$(grep -c 'verdict *| *PASS' smoke-multirow.log)" -eq 2
          test "$(grep -c 'verdict *| *FAIL' smoke-multirow.log || true)" -eq 0

      - name: Tcl smoke placement
        # The same ibm01 run, driven by scripts/flow.tcl through `ktplace --script`
        # instead of the fixed flow. The script is written to be the fixed flow,
        # so the placement it writes must match the step above byte for byte;
        # a difference means the command layer and FlowMgr have drifted apart.
        # A broken script must fail the run with the file and line.
        run: |
          set -euo pipefail

          source ktplace.sh

          ktplace -tcl smoke-multirow.tcl --script scripts/flow.tcl ./benchmark/ICCAD04/ibm01 \
            -w output/ibm01-tcl 2>&1 | tee smoke-tcl.log

          grep -q "tcl> read_design" smoke-tcl.log
          test "$(grep -c 'Tcl script completed successfully' smoke-tcl.log)" -eq 1
          cmp output/ibm01/placed.pl output/ibm01-tcl/placed.pl

          printf 'set x 1\nread_design /no/such/design\n' > broken.tcl
          if ktplace --script broken.tcl -w output/tcl-broken 2> broken.log; then
            echo "::error::a failing Tcl script exited 0"; exit 1
          fi
          grep -q 'file "broken.tcl" line 2' broken.log

  gui:
    # A job of its own, so the other jobs never need Qt. Runs headless on Qt's
    # offscreen platform.
    name: GUI build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libtbb-dev \
            libboost-iostreams-dev \
            libboost-test-dev \
            zlib1g-dev \
            libfmt-dev \
            tcl-dev \
            qt6-base-dev \
            pkg-config \
            fonts-dejavu-core

      - name: Build ktplace-gui
        run: make -j"$(nproc)" gui

      - name: GUI tests
        run: make gui-test
