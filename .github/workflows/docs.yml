name: Docs

# Builds the API documentation and fails on Doxygen warnings. It deliberately does
# NOT publish: the generated site is not deployed to GitHub Pages. The algorithm
# this project implements is specified by a paywalled conference paper, which we
# cannot redistribute, so the reference for the algorithm is that paper (cited in
# README.md and docs/simpl.md) rather than a copy of it hosted here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doxygen:
    name: Build the API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Show toolchain
        run: doxygen --version

      # CImg.h is excluded by the Doxyfile, so this stays a few seconds even
      # though the vendored header is 3.5 MB. HAVE_DOT is off in the Doxyfile to
      # match local builds on machines without graphviz, so the class graph pages
      # are simply not generated rather than the build failing.
      - name: Generate
        run: doxygen Doxyfile

      - name: Fail on documentation warnings
        # An undocumented parameter or a broken \ref is treated as an error, so
        # the API docs cannot silently drift away from the headers.
        run: |
          if [ -s docs/doxygen-warnings.log ]; then
            echo "::error::doxygen reported warnings:"
            cat docs/doxygen-warnings.log
            exit 1
          fi

      - name: Sanity check the site
        run: |
          test -f docs/html/index.html
          test -f docs/html/annotated.html
          echo "pages: $(find docs/html -name '*.html' | wc -l)"
