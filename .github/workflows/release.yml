name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/Master.make
      - scripts/ktplace.sh
      - scripts/ktplace.csh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ONETBB_VERSION: 2021.11.0

jobs:
  package:
    name: Package (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [dynamic, static]

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the engine's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*VERSION = "\(.*\)";/\1/p' src/kt_option.h)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version in src/kt_option.h"
            exit 1
          }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libtbb-dev \
            libboost-iostreams-dev \
            libboost-test-dev \
            zlib1g-dev \
            libfmt-dev \
            cmake \
            ninja-build

      - name: Build a static oneTBB
        if: matrix.variant == 'static'
        run: |
          set -euo pipefail
          curl -sSL -o onetbb.tar.gz \
            "https://github.com/uxlfoundation/oneTBB/archive/refs/tags/v${ONETBB_VERSION}.tar.gz"
          tar -xzf onetbb.tar.gz
          cmake -S "oneTBB-${ONETBB_VERSION}" -B onetbb-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF \
            -DTBB_EXAMPLES=OFF -DTBBMALLOC_BUILD=OFF -DTBB_STRICT=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/onetbb-static"
          cmake --build onetbb-build -j"$(nproc)"
          cmake --install onetbb-build

      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.variant }}" = static ]; then
            make -j"$(nproc)" STATIC=1 TBB_STATIC_ROOT="$PWD/onetbb-static"
            bin=build-static/bin/ktplace
            file "$bin" | grep -q 'statically linked'
          else
            make -j"$(nproc)"
            bin=build/bin/ktplace
          fi
          strip --strip-debug "$bin"
          file "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Unit tests
        if: matrix.variant == 'dynamic'
        run: make -j"$(nproc)" test

      - name: Place ibm01 and adaptec1 with the packaged binary
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" ./benchmark/ICCAD04/ibm01 -w smoke/ibm01 2>&1 | tee ibm01.log
          test "$(grep -c 'verdict *| *PASS' ibm01.log)" -eq 2
          test -s smoke/ibm01/plots/anim/placement.gif
          "$BIN" ./benchmark/ISPD_2005/adaptec1 -w smoke/adaptec1 --no-plots 2>&1 | tee adaptec1.log
          test "$(grep -c 'Placement completed successfully' adaptec1.log)" -eq 1
          test "$(wc -l < smoke/adaptec1/placed.pl)" -eq 211447

      - name: Package
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*VERSION = "\(.*\)";/\1/p' src/kt_option.h)
          suffix=$([ "${{ matrix.variant }}" = static ] && echo "-static" || true)
          name="ktplace-v${version}-linux-x86_64${suffix}"
          mkdir -p "$name/bin"
          cp "$BIN" "$name/bin/ktplace"
          cp scripts/ktplace.sh scripts/ktplace.csh README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256

  publish:
    name: Publish the GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "KTPlace $GITHUB_REF_NAME" \
            --generate-notes
