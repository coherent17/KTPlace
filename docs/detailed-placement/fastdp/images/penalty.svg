<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 320" width="930" height="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The two overlap penalties of Global Swap">
<title>The two overlap penalties of Global Swap</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="929" height="319" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
<text x="20.0" y="26.0" font-size="13" fill="#1e1b4b" text-anchor="start" font-weight="bold">Swapping a wider cell i into the place of cell j</text>
<rect x="40.0" y="150.0" width="680.0" height="52.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="46.0" y="216.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal">segment Seg_j</text>
<rect x="40.0" y="158.0" width="68.0" height="36.0" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" opacity="1.0"/>
<rect x="550.0" y="158.0" width="102.0" height="36.0" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" opacity="1.0"/>
<text x="125.0" y="236.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">s1</text>
<line x1="110.0" y1="226.0" x2="140.0" y2="226.0" stroke="#0f766e" stroke-width="2"/>
<rect x="142.0" y="158.0" width="102.0" height="36.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1.0"/>
<text x="193.0" y="181.0" font-size="13" fill="#1e1b4b" text-anchor="middle" font-weight="bold">j1</text>
<text x="261.0" y="236.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">s2</text>
<line x1="246.0" y1="226.0" x2="276.0" y2="226.0" stroke="#0f766e" stroke-width="2"/>
<rect x="278.0" y="158.0" width="68.0" height="36.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" opacity="1.0"/>
<text x="312.0" y="181.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">j</text>
<text x="363.0" y="236.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">s3</text>
<line x1="348.0" y1="226.0" x2="378.0" y2="226.0" stroke="#0f766e" stroke-width="2"/>
<rect x="380.0" y="158.0" width="102.0" height="36.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1.0"/>
<text x="431.0" y="181.0" font-size="13" fill="#1e1b4b" text-anchor="middle" font-weight="bold">j2</text>
<text x="499.0" y="236.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">s4</text>
<line x1="484.0" y1="226.0" x2="514.0" y2="226.0" stroke="#0f766e" stroke-width="2"/>
<rect x="210.0" y="70.0" width="204.0" height="36.0" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" opacity="1.0"/>
<text x="312.0" y="93.0" font-size="13" fill="#db2777" text-anchor="middle" font-weight="bold">i  (w_i = 6)</text>
<line x1="312.0" y1="108.0" x2="312.0" y2="152.0" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="210.0" y1="62.0" x2="278.0" y2="62.0" stroke="#dc2626" stroke-width="1.5"/>
<line x1="346.0" y1="62.0" x2="414.0" y2="62.0" stroke="#dc2626" stroke-width="1.5"/>
<text x="312.0" y="54.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">extra width w_i − w_j = 4 has to come from the spaces</text>
<text x="734.0" y="150.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">s2 + s3 = 2 &lt; 4:</text>
<text x="734.0" y="166.0" font-size="12" fill="#4f46e5" text-anchor="start" font-weight="bold">j1, j2 shift  →  P1</text>
<text x="734.0" y="196.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">S1 = s1+…+s4 = 4:</text>
<text x="734.0" y="212.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="bold">enough, so no P2</text>
<text x="20.0" y="276.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">P1 = ((w_i − w_j) − (s2 + s3)) · wt1  ·  when the two nearest spaces are not enough</text>
<text x="20.0" y="298.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">P2 = ((w_i − w_j) − S1) · wt2  ·  when even the four nearest are not, with wt2 ≫ wt1</text>
</svg>
