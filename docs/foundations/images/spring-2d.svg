<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One cell between two pins on a plane">
<title>One cell between two pins on a plane</title>
<rect x="0.5" y="0.5" width="859" height="379" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
<text x="20" y="28" font-size="13" fill="#1e1b4b" font-weight="bold">The cell of §3.1 on a plane: each spring's length² = horizontal gap² + vertical gap²</text>
<g stroke="#e2e8f0" stroke-width="1">
<line x1="70" y1="330" x2="550" y2="330"/><line x1="70" y1="255" x2="550" y2="255"/><line x1="70" y1="180" x2="550" y2="180"/><line x1="70" y1="105" x2="550" y2="105"/>
<line x1="70" y1="80" x2="70" y2="330"/><line x1="145" y1="80" x2="145" y2="330"/><line x1="220" y1="80" x2="220" y2="330"/><line x1="295" y1="80" x2="295" y2="330"/><line x1="370" y1="80" x2="370" y2="330"/><line x1="445" y1="80" x2="445" y2="330"/><line x1="520" y1="80" x2="520" y2="330"/>
</g>
<g font-size="11" fill="#64748b" text-anchor="middle">
<text x="70" y="350">0</text><text x="145" y="350">1</text><text x="220" y="350">2</text><text x="295" y="350">3</text><text x="370" y="350">4</text><text x="445" y="350">5</text><text x="520" y="350">6</text>
<text x="56" y="334">0</text><text x="56" y="259">1</text><text x="56" y="184">2</text><text x="56" y="109">3</text>
<text x="545" y="368">x</text><text x="40" y="92">y</text>
</g>
<line x1="70" y1="330" x2="370" y2="330" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="370" y1="330" x2="370" y2="180" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="220" y="322" font-size="12" fill="#4f46e5" text-anchor="middle" font-weight="bold">horizontal gap 4</text>
<text x="378" y="262" font-size="12" fill="#4f46e5" font-weight="bold">vertical gap 2</text>
<line x1="370" y1="180" x2="520" y2="180" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="520" y1="180" x2="520" y2="105" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="445" y="198" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">horizontal gap 2</text>
<text x="528" y="148" font-size="12" fill="#0f766e" font-weight="bold">vertical gap 1</text>
<line x1="70" y1="330" x2="370" y2="180" stroke="#4f46e5" stroke-width="3"/>
<line x1="370" y1="180" x2="520" y2="105" stroke="#0f766e" stroke-width="5"/>
<text x="205" y="240" font-size="12" fill="#4f46e5" font-weight="bold" text-anchor="end">w = 1</text>
<text x="438" y="130" font-size="12" fill="#0f766e" font-weight="bold" text-anchor="end">w = 2</text>
<rect x="58" y="318" width="24" height="24" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<rect x="508" y="93" width="24" height="24" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<text x="90" y="312" font-size="12" fill="#374151">pin (0, 0)</text>
<text x="480" y="86" font-size="12" fill="#374151" text-anchor="end">pin (6, 3)</text>
<rect x="356" y="166" width="28" height="28" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="370" y="185" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">cell</text>
<text x="330" y="160" font-size="12" fill="#2563eb" text-anchor="end" font-weight="bold">(4, 2)</text>
<g font-size="12.5">
<text x="590" y="110" fill="#4f46e5" font-weight="bold">spring to (0, 0), w = 1</text>
<text x="590" y="130" fill="#1e1b4b">1 · (4² + 2²) = 16 + 4</text>
<text x="590" y="170" fill="#0f766e" font-weight="bold">spring to (6, 3), w = 2</text>
<text x="590" y="190" fill="#1e1b4b">2 · (2² + 1²) = 8 + 2</text>
<line x1="590" y1="210" x2="840" y2="210" stroke="#c7d2fe"/>
<text x="590" y="234" fill="#1e1b4b" font-weight="bold">x part: 16 + 8 = 24</text>
<text x="590" y="256" fill="#1e1b4b" font-weight="bold">y part: 4 + 2 = 6</text>
<text x="590" y="278" fill="#db2777" font-weight="bold">Φ = 30</text>
<text x="590" y="312" fill="#64748b">x part = the §3.1 problem</text>
<text x="590" y="330" fill="#64748b">y part = same shape, pins at 0 and 3</text>
</g>
</svg>
