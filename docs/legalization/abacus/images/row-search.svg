<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Abacus tries rows outwards from the nearest one">
<title>Abacus tries rows outwards from the nearest one</title>
