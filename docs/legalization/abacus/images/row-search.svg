<rect x="0.5" y="0.5" width="639" height="329" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
<rect x="120.0" y="26.0" width="330.0" height="28.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="45.0" font-size="12" fill="#64748b" text-anchor="end" font-weight="normal">row 6</text>
<line x1="130.0" y1="32.0" x2="150.0" y2="48.0" stroke="#dc2626" stroke-width="2"/>
<line x1="150.0" y1="32.0" x2="130.0" y2="48.0" stroke="#dc2626" stroke-width="2"/>
<rect x="120.0" y="66.0" width="330.0" height="28.0" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="85.0" font-size="12" fill="#1e1b4b" text-anchor="end" font-weight="normal">row 5</text>
<circle cx="140" cy="80" r="10" fill="#4f46e5"/>
<text x="140.0" y="84.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<rect x="120.0" y="106.0" width="330.0" height="28.0" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="125.0" font-size="12" fill="#1e1b4b" text-anchor="end" font-weight="normal">row 4</text>
<circle cx="140" cy="120" r="10" fill="#4f46e5"/>
<text x="140.0" y="124.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<rect x="120.0" y="146.0" width="330.0" height="28.0" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="165.0" font-size="12" fill="#1e1b4b" text-anchor="end" font-weight="normal">row 3</text>
<circle cx="140" cy="160" r="10" fill="#4f46e5"/>
<text x="140.0" y="164.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<rect x="120.0" y="186.0" width="330.0" height="28.0" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="205.0" font-size="12" fill="#1e1b4b" text-anchor="end" font-weight="normal">row 2</text>
<circle cx="140" cy="200" r="10" fill="#4f46e5"/>
<text x="140.0" y="204.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<rect x="120.0" y="226.0" width="330.0" height="28.0" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="245.0" font-size="12" fill="#1e1b4b" text-anchor="end" font-weight="normal">row 1</text>
<circle cx="140" cy="240" r="10" fill="#4f46e5"/>
<text x="140.0" y="244.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<rect x="120.0" y="266.0" width="330.0" height="28.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="285.0" font-size="12" fill="#64748b" text-anchor="end" font-weight="normal">row 0</text>
<line x1="130.0" y1="272.0" x2="150.0" y2="288.0" stroke="#dc2626" stroke-width="2"/>
<line x1="150.0" y1="272.0" x2="130.0" y2="288.0" stroke="#dc2626" stroke-width="2"/>
<rect x="280.0" y="166.0" width="60.0" height="24.0" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 3" opacity="1.0"/>
<text x="310.0" y="182.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="bold">cell i</text>
<line x1="350.0" y1="178.0" x2="350.0" y2="160.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470.0" y="64.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">1. nearest row first</text>
<text x="470.0" y="84.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">2.–5. then outwards,</text>
<text x="470.0" y="100.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">alternating up and down</text>
<text x="470.0" y="140.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">for each row: the vertical</text>
<text x="470.0" y="156.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">distance alone is a lower</text>
<text x="470.0" y="172.0" font-size="12" fill="#1e1b4b" text-anchor="start" font-weight="normal">bound on the cost</text>
<text x="470.0" y="220.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">stop a direction once that</text>
<text x="470.0" y="236.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">bound exceeds the best</text>
<text x="470.0" y="252.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">cost found so far</text>
<line x1="458.0" y1="40.0" x2="458.0" y2="280.0" stroke="#e2e8f0" stroke-width="1"/>
</svg>
